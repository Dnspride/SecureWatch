---
# ==============================================================================
# Ansible Playbook: Deploy SecureWatch Platform onto Production EC2 Nodes
# ==============================================================================
- name: Deploy SecureWatch Platform
  hosts: soc_servers
  become: yes
  vars:
    app_dir: /opt/securewatch
    docker_compose_version: "v2.24.5"

  tasks:
    - name: Update apt cache and install base packages
      apt:
        update_cache: yes
        name:
          - curl
          - git
          - ufw
          - fail2ban
          - ca-certificates
        state: present

    - name: Configure firewall rules
      ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - "22"
        - "80"
        - "443"

    - name: Enable UFW
      ufw:
        state: enabled

    - name: Install Docker engine
      shell: |
        curl -fsSL https://get.docker.com -o get-docker.sh
        sh get-docker.sh
      args:
        creates: /usr/bin/docker

    - name: Create deployment directories
      file:
        path: "{{ item }}"
        state: directory
        mode: '0750'
      loop:
        - "{{ app_dir }}"
        - "{{ app_dir }}/logs"
        - "{{ app_dir }}/data"

    - name: Copy Docker Compose and configurations
      copy:
        src: ../../docker-compose.yml
        dest: "{{ app_dir }}/docker-compose.yml"
        mode: '0640'

    - name: Copy production environment variables
      template:
        src: ../templates/env.j2
        dest: "{{ app_dir }}/.env"
        mode: '0600'

    - name: Pull and start containers via Docker Compose
      shell: "docker compose -f {{ app_dir }}/docker-compose.yml up -d --remove-orphans"
      args:
        chdir: "{{ app_dir }}"

    - name: Run database migrations and seeds
      shell: "docker compose exec -T backend python -m database.seeds.seed_data"
      args:
        chdir: "{{ app_dir }}"
