global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "securewatch-backend"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["backend:8000"]

  - job_name: "opensearch"
    metrics_path: "/_prometheus/metrics"
    static_configs:
      - targets: ["opensearch:9200"]

  - job_name: "redis"
    static_configs:
      - targets: ["redis:6379"]
