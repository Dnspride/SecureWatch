---
# =============================================================================
# Rule: Brute Force Login Detection
# MITRE ATT&CK: T1110.001 – Brute Force: Password Guessing
# =============================================================================

id: brute-force-login
name: Brute Force Login Attempt
version: "1.1.0"
description: >
  Detects five or more failed authentication attempts from the same source IP
  or against the same username within a 10-minute rolling window. Elevated
  counts may indicate credential stuffing or password-spray attacks.

event_sources:
  - windows_event_log
  - linux_auth
  - sshd
  - vpn_auth

event_categories:
  - authentication

conditions:
  - field: event_type
    operator: in
    value:
      - login_failed
      - authentication_failure
      - invalid_password
  - field: source_ip
    operator: exists

condition_logic: all

# Threshold: 5 failures in 10 minutes, grouped per username + source_ip
time_window_seconds: 600
threshold_count: 5
group_by:
  - field: username
  - field: source_ip

severity: high
mitre_tactic: Credential Access
mitre_technique: T1110.001

tags:
  - brute-force
  - credential-access
  - authentication

recommended_steps:
  - "Identify the source IP and correlate with threat intelligence feeds."
  - "Check if the targeted account exists and review recent activity."
  - "Temporarily block the source IP at the firewall/WAF if abuse is confirmed."
  - "If the account is a service account, rotate credentials immediately."
  - "Enable MFA on the targeted account if not already enforced."
  - "Review neighbouring time window for successful logins (potential compromise)."

suppress_duplicate_seconds: 300
is_active: true
is_builtin: true
created_by: system
